# Private local instance; not a public search service.
use_default_settings: true
general:
  debug: false
  instance_name: Alpha research local search
search:
  default_lang: ru
  autocomplete: ""
  formats:
    - html
    - json
server:
  bind_address: "0.0.0.0"
  port: 8080
  limiter: false
  image_proxy: false
  public_instance: false
  # Actual random secret is supplied through SEARXNG_SECRET from the ignored .env.
outgoing:
  request_timeout: 6.0
  max_request_timeout: 12.0
