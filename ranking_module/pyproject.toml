[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alfa-insights"
version = "0.1.0"
description = "Ranking module for Alfa Insights: news + analytics set generation"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "pandas>=2.1",
  "numpy>=1.26",
  "pyyaml>=6.0",
  "jsonschema>=4.20",
  "orjson>=3.9",
  "sentence-transformers>=2.7",
  "faiss-cpu>=1.8",
  "scikit-learn>=1.4",
]

[project.optional-dependencies]
gpu = ["faiss-gpu>=1.8", "torch>=2.2"]
dev = ["pytest>=8", "ruff>=0.4", "mypy>=1.9"]

[tool.hatch.build.targets.wheel]
packages = ["src/alfa_insights"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]